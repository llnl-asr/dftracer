# GitLab CI for dftracer.
#
# Two job families coexist here:
#   1. Pre-existing LC HPC jobs (tuolumne/corona, .gitlab/scripts/) — these
#      keep their original behavior: they run ONLY on web-triggered pipelines
#      (each now carries an explicit `web` rule since the global workflow
#      rules were widened for the migrated jobs below).
#   2. Jobs converted from .github/workflows/ (gitlab-migration, 2026-07-30).
#      These run on the LC corona SHELL runner using an explicit Flux
#      allocation (see .corona-flux below) and module-provided toolchains
#      instead of docker images. The GitHub workflows are untouched and remain
#      authoritative for GitHub; this conversion is additive. See
#      .migration/dftracer.md and .migration/REVERT.md.
#
# Flux-allocation flow (canonical, from cpp-logger): the job runs on the
# shell runner, creates ONE 1-node allocation with `flux batch`, grabs its id
# with `flux job last`, and then runs EACH CI phase inside that same
# allocation through `flux proxy <jobid>`. The allocation is cancelled in
# after_script. A normal push/MR pipeline runs a single `ci` job, so the
# whole pipeline uses ONE allocation total; the benchmark jobs and publish
# jobs are manual and create their own allocation only when triggered.
# Phase commands live in .gitlab/flux-ci/*.sh (quoting-safe for
# `flux proxy ... bash -lc`).
#
# Required CI/CD variables (Settings > CI/CD > Variables) for the manual
# publish jobs (leave unset if you never run them):
#   PYPI_TOKEN       - PyPI API token (python-publish, prerelease:publish)
#   DOCKER_USERNAME  - DockerHub username (docker-publish)
#   DOCKER_PASSWORD  - DockerHub password/token (docker-publish)
#
# Conversion map (GitHub workflow -> GitLab job/phase):
#   format-check.yml    -> ci (phase .gitlab/flux-ci/format-check.sh)
#   ci.yml              -> ci (phase .gitlab/flux-ci/build-test.sh; the
#                          python x gcc matrix is collapsed to the corona
#                          module toolchain gcc/11.2.1 + python/3.13.2;
#                          Coveralls upload and GitHub step-summary extras
#                          are GitHub-only and omitted)
#   valgrind-ci.yml     -> ci (phase .gitlab/flux-ci/valgrind-gates.sh)
#   hdf5-mpi-trace-ci   -> ci (phase .gitlab/flux-ci/hdf5-mpi-trace.sh;
#                          spack-image matrix collapsed to the corona
#                          hdf5-parallel + mvapich2 modules)
#   docs (ReadTheDocs)  -> ci (phase .gitlab/flux-ci/docs.sh) + pages
#   benchmark.yml       -> benchmark (IOR; manual; the store-results job that
#                          pushes CSVs back to the GitHub PR branch is
#                          GitHub-only and replaced by artifacts)
#   dlio-benchmark.yml  -> dlio-benchmark (manual; matrix of workloads)
#   wheels.yml          -> wheels (manual; cibuildwheel needs a container
#                          engine on the node)
#   prerelease.yml      -> prerelease:publish (manual, develop)
#   python-publish.yml  -> python-publish (manual, tags)
#   docker-publish.yml  -> docker-publish (manual, v* tags; docker:dind)

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'
    - when: never

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  CUSTOM_CI_BUILDS_DIR: "/usr/workspace/iopp/gitlab-runner-builds"
  CUSTOM_CI_ENV_DIR: "/usr/workspace/iopp/gitlab-runner-envs"
  DFTRACER_ENABLE_DYNAMIC_DETECTION: "ON"
  DFTRACER_DISABLE_HWLOC: "OFF"
  # Repository information
  DLIO_BENCHMARK_REPO: https://github.com/argonne-lcf/dlio_benchmark.git
  DLIO_BENCHMARK_TAG: main
  DFTRACER_REPO: https://github.com/LLNL/dftracer.git
  # test variable
  ENV_NAME: dlio_env
  # test variables
  MIN_NODES: 1
  MAX_NODES: 8
  EXCLUSION_LIST: llama_70b_zero3-0;llama_70b-4
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

stages:
  - build
  - generate
  - alloc
  - lint
  - test
  - benchmark
  - publish
  - deploy
  - cleanup

# Templates and anchors --------------------------------------------------

# Corona shell runner + explicit Flux allocation flow. Reuses the .corona
# variables (modules incl. MPI_MODULE mvapich2/2.3.7, queues) from
# .gitlab/scripts/common.yml. No SCHEDULER_PARAMETERS: jobs create their own
# allocation with `flux batch` and run phases via `flux proxy`.
.corona-flux:
  extends: .corona
  tags:
    - shell
    - corona

# Pre-existing LC HPC jobs: web-triggered pipelines only (original behavior).
.web-only-rules: &web-only-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Migrated GitHub jobs: push + merge request pipelines.
.push-mr-rules: &push-mr-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

##############################################################################
# Pre-existing LC HPC jobs (unchanged apart from the explicit web-only rule)
##############################################################################

dft_tuo_build:
  extends: .tuolumne
  <<: *web-only-rules
  stage: build
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [[ "$DEBUG" != "1" ]]; then source .gitlab/scripts/build.sh; else echo "Not building from scratch as running in Debug mode."; fi

# dft_tuo_test:
#   extends: .tuolumne
#   stage: test
#   script:
#     - source .gitlab/scripts/variables.sh
#     - source .gitlab/scripts/pre.sh
#     - bash .gitlab/scripts/run_dft_hip_test.sh

dlio_tuo_generate:
  extends: .tuolumne
  <<: *web-only-rules
  stage: generate
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [ -f .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml ]; then rm .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml; fi
    - python .gitlab/scripts/generate_dlio_job.py --output .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml --log-level INFO
    - if [ ! -f .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml ]; then echo 'File not generated!'; exit 1; fi
    - cat .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml
  artifacts:
    paths:
      - .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml

dlio_tuo_test:
  stage: test
  <<: *web-only-rules
  trigger:
    include:
      - artifact: .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml
        job: dlio_tuo_generate
    strategy: depend
    forward:
      pipeline_variables: true

dlio_corona_build:
  extends: .corona
  <<: *web-only-rules
  stage: build
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [[ "$DEBUG" != "1" ]]; then source .gitlab/scripts/build.sh; else echo "Not building from scratch as running in Debug mode."; fi

dlio_corona_generate:
  extends: .corona
  <<: *web-only-rules
  stage: generate
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [ -f .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml ]; then rm .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml; fi
    - python .gitlab/scripts/generate_dlio_job.py --output .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml --log-level INFO
    - if [ ! -f .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml ]; then echo 'File not generated!'; exit 1; fi
    - cat .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml
  artifacts:
    paths:
      - .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml

dlio_corona_test:
  stage: test
  <<: *web-only-rules
  trigger:
    include:
      - artifact: .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml
        job: dlio_corona_generate
    strategy: depend
    forward:
      pipeline_variables: true

include:
  - project: "lc-templates/id_tokens"
    file: "id_tokens.yml"
  - local: ".gitlab/scripts/common.yml"

##############################################################################
# ci: the ONE allocation for a normal push/MR pipeline. Merges the previous
# format-check, ci:build-test, valgrind:gates, hdf5-mpi-trace and docs jobs
# into sequential phases run inside a single Flux allocation via flux proxy.
# NOTE: uses LARGE_QUEUE (pbatch) / LARGE_QUEUE_WALLTIME (480m) because the
# combined phases (build+test, full valgrind gates, HDF5/MPI verify, docs)
# do not fit the 60m pdebug walltime.
##############################################################################
# Creates the pipeline-global allocation; its id is shared via .flux-jobid.
allocate:
  extends: .corona-flux
  stage: alloc
  <<: *push-mr-rules
  script:
    # flux alloc --bg submits the allocation and BLOCKS until it is granted
    # (no timeout — batch queues may take long), then returns leaving the
    # instance running in the background.
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name=dftracer-ci
    - JOBID=$(flux job last)
    - echo "$JOBID" > .flux-jobid
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list
  artifacts:
    paths: [.flux-jobid]

ci:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  <<: *push-mr-rules
  timeout: 9h
  script:
    - JOBID=$(cat .flux-jobid)
    # Each CI phase runs on the shared allocation via flux proxy.
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/format-check.sh"
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/build-test.sh"
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/valgrind-gates.sh"
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/hdf5-mpi-trace.sh"
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/docs.sh"
  artifacts:
    when: always
    paths:
      - public
      - dftracer-build/trace-verify/

##############################################################################
# benchmark.yml -> IOR benchmark. MANUAL: it creates its own Flux allocation,
# so normal push/MR pipelines stay single-allocation (only the `ci` job).
##############################################################################
benchmark:
  extends: .corona-flux
  stage: benchmark
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  variables:
    IOR_REPO: "https://github.com/hpc/ior.git"
    IOR_VERSION: "4.0.0"
  script:
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=dftracer-benchmark
    - JOBID=$(flux job last)
    - echo "Using Flux allocation $JOBID"
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/benchmark.sh"
  after_script:
    - JOBID=$(flux job last) && flux cancel "$JOBID" || true
  artifacts:
    paths: [cases.csv, overhead.csv]
    expire_in: 30 days

##############################################################################
# dlio-benchmark.yml -> DLIO integration. MANUAL for the same reason as
# benchmark: each matrix entry creates its own Flux allocation when
# triggered, keeping normal pipelines at one allocation total.
##############################################################################
dlio-benchmark:
  extends: .corona-flux
  stage: benchmark
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  timeout: 9h
  parallel:
    matrix:
      - WORKLOAD: [bert_v100, cosmoflow_h100, dlrm, resnet50_tf, resnet50_h100, unet3d_h100]
  variables:
    INSTALL_MODE: pip
    DLIO_LOG_LEVEL: info
    VALGRIND_DLIO_TIMEOUT: "3600"
    RDMAV_FORK_SAFE: "1"
  script:
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name=dftracer-dlio-$WORKLOAD
    - JOBID=$(flux job last)
    - echo "Using Flux allocation $JOBID"
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/dlio-benchmark.sh"
  after_script:
    - JOBID=$(flux job last) && flux cancel "$JOBID" || true

##############################################################################
# wheels.yml -> wheel builds (manual). cibuildwheel needs a container
# engine; runs in its own Flux allocation when triggered.
##############################################################################
wheels:
  extends: .corona-flux
  stage: publish
  rules:
    - when: manual
      allow_failure: true
  parallel:
    matrix:
      - PYTHON: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
  variables:
    GLIBC: "2.28"
    CIBW_CONTAINER_ENGINE: docker
    DFTRACER_PODMAN_KEEP_STORAGE: "1"
  timeout: 3h
  script:
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name=dftracer-wheels
    - JOBID=$(flux job last)
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/wheels.sh"
  after_script:
    - JOBID=$(flux job last) && flux cancel "$JOBID" || true
  artifacts:
    paths: [wheelhouse/*.whl]
    expire_in: 30 days

##############################################################################
# python-publish.yml -> publish release to PyPI (manual, tags only). Needs
# PYPI_TOKEN; runs in its own Flux allocation when triggered.
##############################################################################
python-publish:
  extends: .corona-flux
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
      allow_failure: true
  variables:
    GLIBC: "2.28"
    CIBW_CONTAINER_ENGINE: docker
  timeout: 9h
  script:
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name=dftracer-pypi
    - JOBID=$(flux job last)
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/python-publish.sh"
  after_script:
    - JOBID=$(flux job last) && flux cancel "$JOBID" || true

##############################################################################
# prerelease.yml -> publish .postN prerelease to PyPI (manual, develop).
# Needs PYPI_TOKEN; runs in its own Flux allocation when triggered.
##############################################################################
prerelease:publish:
  extends: .corona-flux
  stage: publish
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
      allow_failure: true
  variables:
    GLIBC: "2.28"
    DFTRACER_VERSION_SCHEME: post
    CIBW_CONTAINER_ENGINE: docker
  timeout: 9h
  script:
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name=dftracer-prerelease
    - JOBID=$(flux job last)
    - flux proxy "$JOBID" bash -lc "bash .gitlab/flux-ci/prerelease-publish.sh"
  after_script:
    - JOBID=$(flux job last) && flux cancel "$JOBID" || true

##############################################################################
# docker-publish.yml -> DockerHub image (manual, v* tags). Keeps its docker
# image config (docker:dind runner required — the only migrated job that
# stays on a docker executor, since it is inherently a docker workload).
# Multi-arch (amd64+arm64) via buildx+qemu.
##############################################################################
docker-publish:
  stage: publish
  image: docker:latest
  services: [docker:dind]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
      allow_failure: true
  variables:
    IMAGE_NAME: dftracer/dftracer
  timeout: 4h
  script:
    - docker login -u "${DOCKER_USERNAME}" -p "${DOCKER_PASSWORD}" docker.io
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use
    - VERSION_TAG="${CI_COMMIT_TAG#v}"
    - docker buildx build
      --file infrastructure/docker/Dockerfile.prod
      --platform linux/amd64,linux/arm64
      --build-arg DFTRACER_VERSION=${VERSION_TAG}
      --tag ${IMAGE_NAME}:${VERSION_TAG}
      --tag ${IMAGE_NAME}:latest
      --push .

##############################################################################
# GitLab Pages: republishes the docs artifact built by the `ci` job
# (shell runner, no allocation).
##############################################################################
pages:
  extends: .corona-flux
  stage: deploy
  needs: [ci]
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "gitlab-migration"'  # temporary: remove after merge to develop
  script:
    - echo "Publishing docs built by the ci job"
  artifacts:
    paths: [public]

##############################################################################
# Releases the pipeline-global Flux allocation (runs even on failure).
##############################################################################
release-allocation:
  extends: .corona-flux
  stage: cleanup
  needs: [allocate, ci]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
  script:
    - flux cancel "$(cat .flux-jobid)" || true
