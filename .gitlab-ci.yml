# GitLab CI for dftracer.
#
# Two job families coexist here:
#   1. Pre-existing LC HPC jobs (tuolumne/corona, .gitlab/scripts/) — these
#      keep their original behavior: they run ONLY on web-triggered pipelines
#      (each now carries an explicit `web` rule since the global workflow
#      rules were widened for the migrated jobs below).
#   2. Jobs converted from .github/workflows/ (gitlab-migration, 2026-07-30).
#      These run on the LC corona SHELL runner using an explicit Flux
#      allocation (see .corona-flux below) and module-provided toolchains
#      instead of docker images. The GitHub workflows are untouched and remain
#      authoritative for GitHub; this conversion is additive. See
#      .migration/dftracer.md and .migration/REVERT.md.
#
# Flux-allocation flow (canonical, from cpp-logger): the job runs on the
# shell runner, creates ONE 1-node allocation with `flux batch`, grabs its id
# via a unique job name, and then runs EACH CI phase inside that same
# allocation through `flux proxy <jobid>`. The allocation is cancelled in
# after_script. A normal push/MR pipeline runs a single `ci` job, so the
# whole pipeline uses ONE allocation total; the benchmark jobs and publish
# jobs are manual and create their own allocation only when triggered.
# Phase commands live in .gitlab/flux-ci/*.sh (quoting-safe for
# `flux proxy ... bash -lc`).
#
# Required CI/CD variables (Settings > CI/CD > Variables) for the manual
# publish jobs (leave unset if you never run them). Nothing here publishes to
# PyPI: GitLab only publishes to the dldl workspace, and PyPI stays with the
# GitHub workflows.
#   DOCKER_USERNAME  - DockerHub username (docker-publish)
#   DOCKER_PASSWORD  - DockerHub password/token (docker-publish)
#
# Conversion map (GitHub workflow -> GitLab job/phase):
#   format-check.yml    -> ci (phase .gitlab/flux-ci/format-check.sh)
#   ci.yml              -> ci (phase .gitlab/flux-ci/build-test.sh; the
#                          python x gcc matrix is collapsed to the corona
#                          module toolchain gcc/11.2.1 + python/3.13.2;
#                          Coveralls upload and GitHub step-summary extras
#                          are GitHub-only and omitted)
#   valgrind-ci.yml     -> ci (phase .gitlab/flux-ci/valgrind-gates.sh)
#   hdf5-mpi-trace-ci   -> ci (phase .gitlab/flux-ci/hdf5-mpi-trace.sh;
#                          spack-image matrix collapsed to the corona
#                          hdf5-parallel + mvapich2 modules)
#   docs (ReadTheDocs)  -> ci (phase .gitlab/flux-ci/docs.sh) + distribute
#                          (published to the dldl workspace, not GitLab Pages)
#   benchmark.yml       -> benchmark (IOR; manual; the store-results job that
#                          pushes CSVs back to the GitHub PR branch is
#                          GitHub-only and replaced by artifacts)
#   dlio-benchmark.yml  -> dlio-benchmark (manual; matrix of workloads)
#   wheels.yml          -> wheels (merge requests and develop; cibuildwheel
#                          needs a container engine on the node)
#   prerelease.yml      -> not migrated (PyPI publishing stays on GitHub)
#   python-publish.yml  -> not migrated (PyPI publishing stays on GitHub)
#   docker-publish.yml  -> docker-publish (manual, v* tags; docker:dind)

# A branch push pipelines alongside the merge request's, taking every
# allocation twice.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - when: never

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  # build_wheels.sh versions from `git describe`. The default shallow fetch
  # hides the tags once develop moves past them.
  GIT_DEPTH: 0
  # Jacamar reads these while preparing the environment, before any job shell
  # exists, so $USER cannot be used here. $GITLAB_USER_LOGIN is a GitLab
  # predefined variable (the account that triggered the pipeline) and IS
  # expanded by the runner; on LC it matches the account Jacamar runs the job
  # as. Jacamar additionally appends /<user>/builds under this base, so the
  # per-user split holds even if the two ever diverge.
  CUSTOM_CI_BUILDS_DIR: "/usr/workspace/$GITLAB_USER_LOGIN/gitlab-runner-builds"
  CUSTOM_CI_ENV_DIR: "/usr/workspace/$GITLAB_USER_LOGIN/gitlab-runner-envs"
  DFTRACER_ENABLE_DYNAMIC_DETECTION: "ON"
  DFTRACER_DISABLE_HWLOC: "OFF"
  # Repository information
  DLIO_BENCHMARK_REPO: https://github.com/argonne-lcf/dlio_benchmark.git
  DLIO_BENCHMARK_TAG: main
  DFTRACER_REPO: https://github.com/LLNL/dftracer.git
  # test variable
  ENV_NAME: dlio_env
  # test variables
  MIN_NODES: 1
  MAX_NODES: 8
  EXCLUSION_LIST: llama_70b_zero3-0;llama_70b-4
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

stages:
  - build
  - generate
  - alloc
  - lint
  - test
  - benchmark
  - publish
  - deploy
  - cleanup

# Templates and anchors --------------------------------------------------

# Corona shell runner + explicit Flux allocation flow. Reuses the .corona
# variables (modules incl. MPI_MODULE mvapich2/2.3.7, queues) from
# .gitlab/scripts/common.yml. No SCHEDULER_PARAMETERS: jobs create their own
# allocation with `flux batch` and run phases via `flux proxy`.
.corona-flux:
  extends: .corona
  tags:
    - shell
    - corona
  variables:
    # Same name in every job of a pipeline, distinct across pipelines, so any
    # job can find this pipeline's allocation without a shared state file
    # (the runner build dir is reused across pipelines, so a file races).
    ALLOC_NAME: "dftracer-ci-$CI_PIPELINE_ID"

# Pre-existing LC HPC jobs: web-triggered pipelines only (original behavior).
.web-only-rules: &web-only-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'

# Anything that cannot change what a build or a wheel produces is left out, so
# a docs-only change costs nothing but the docs job.
.code-paths: &code-paths
  - CMakeLists.txt
  - setup.py
  - pyproject.toml
  - PACKAGE_VERSION
  - VERSION
  - src/**/*
  - include/**/*
  - test/**/*
  - cmake/**/*
  - dependency/**/*
  - python/**/*
  - scripts/**/*
  - tools/**/*
  - .gitlab-ci.yml
  - .gitlab/**/*

# Migrated GitHub jobs: push + merge request pipelines.
.push-mr-rules: &push-mr-rules
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push"'

##############################################################################
# Pre-existing LC HPC jobs (unchanged apart from the explicit web-only rule)
##############################################################################

dft_tuo_build:
  extends: .tuolumne
  <<: *web-only-rules
  stage: build
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [[ "$DEBUG" != "1" ]]; then source .gitlab/scripts/build.sh; else echo "Not building from scratch as running in Debug mode."; fi

# dft_tuo_test:
#   extends: .tuolumne
#   stage: test
#   script:
#     - source .gitlab/scripts/variables.sh
#     - source .gitlab/scripts/pre.sh
#     - bash .gitlab/scripts/run_dft_hip_test.sh

dlio_tuo_generate:
  extends: .tuolumne
  <<: *web-only-rules
  stage: generate
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [ -f .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml ]; then rm .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml; fi
    - python .gitlab/scripts/generate_dlio_job.py --output .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml --log-level INFO
    - if [ ! -f .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml ]; then echo 'File not generated!'; exit 1; fi
    - cat .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml
  artifacts:
    paths:
      - .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml

dlio_tuo_test:
  stage: test
  <<: *web-only-rules
  trigger:
    include:
      - artifact: .gitlab/scripts/run_dlio_workload_test_tuo_ci.yaml
        job: dlio_tuo_generate
    strategy: depend
    forward:
      pipeline_variables: true

dlio_corona_build:
  extends: .corona
  <<: *web-only-rules
  stage: build
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [[ "$DEBUG" != "1" ]]; then source .gitlab/scripts/build.sh; else echo "Not building from scratch as running in Debug mode."; fi

dlio_corona_generate:
  extends: .corona
  <<: *web-only-rules
  stage: generate
  script:
    - source .gitlab/scripts/variables.sh
    - source .gitlab/scripts/pre.sh
    - if [ -f .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml ]; then rm .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml; fi
    - python .gitlab/scripts/generate_dlio_job.py --output .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml --log-level INFO
    - if [ ! -f .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml ]; then echo 'File not generated!'; exit 1; fi
    - cat .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml
  artifacts:
    paths:
      - .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml

dlio_corona_test:
  stage: test
  <<: *web-only-rules
  trigger:
    include:
      - artifact: .gitlab/scripts/run_dlio_workload_test_corona_ci.yaml
        job: dlio_corona_generate
    strategy: depend
    forward:
      pipeline_variables: true

include:
  - project: "lc-templates/id_tokens"
    file: "id_tokens.yml"
  - local: ".gitlab/scripts/common.yml"

##############################################################################
# ci: the ONE allocation for a normal push/MR pipeline. Merges the previous
# format-check, ci:build-test, valgrind:gates, hdf5-mpi-trace and docs jobs
# into sequential phases run inside a single Flux allocation via flux proxy.
# NOTE: uses LARGE_QUEUE (pbatch) / LARGE_QUEUE_WALLTIME (480m) because the
# combined phases (build+test, full valgrind gates, HDF5/MPI verify, docs)
# do not fit the 60m pdebug walltime.
##############################################################################
# Creates the pipeline-global allocation; every job finds it by $ALLOC_NAME.
allocate:
  extends: .corona-flux
  stage: alloc
  <<: *push-mr-rules
  script:
    # flux alloc --bg submits the allocation and BLOCKS until it is granted
    # (no timeout — batch queues may take long), then returns leaving the
    # instance running in the background.
    # ALLOC_NAME comes from .corona-flux and is the SAME in every job of this
    # pipeline; do not redefine it here or `ci` cannot find the allocation.
    # A retried `allocate` must not leave the previous attempt running.
    - for id in $(flux jobs -n --name="$ALLOC_NAME" -o "{id}" 2>/dev/null); do echo "cancelling stale allocation $id"; flux cancel "$id" || true; done
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "Created Flux allocation $JOBID (shared by all CI jobs)"
    - flux proxy "$JOBID" flux resource list

ci:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
      changes: *code-paths
  timeout: 9h
  script:
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    # Each phase runs ON the allocated node (flux run) inside a podman
    # container using the same image as the corresponding GitHub workflow.
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/run-in-podman.sh docker.io/library/ubuntu:22.04 .gitlab/flux-ci/format-check.sh
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/run-in-podman.sh docker.io/library/ubuntu:22.04 .gitlab/flux-ci/build-test.sh
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/run-in-podman.sh docker.io/library/ubuntu:22.04 .gitlab/flux-ci/valgrind-gates.sh
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/run-in-podman.sh docker.io/hdevarajan92/brahma-ci:latest .gitlab/flux-ci/hdf5-mpi-trace.sh
  artifacts:
    when: always
    paths:
      - dftracer-build/trace-verify/

##############################################################################
# benchmark.yml -> IOR benchmark. MANUAL: it creates its own Flux allocation,
# so normal push/MR pipelines stay single-allocation (only the `ci` job).
##############################################################################
benchmark:
  extends: .corona-flux
  stage: benchmark
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  variables:
    ALLOC_NAME: "dftracer-benchmark-$CI_JOB_ID"
    IOR_REPO: "https://github.com/hpc/ior.git"
    IOR_VERSION: "4.0.0"
  script:
    # Unique per-job name: `flux job last` is user-global and races with
    # other pipelines running under the same LC account.
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "Using Flux allocation $JOBID"
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/run-in-podman.sh docker.io/library/ubuntu:22.04 .gitlab/flux-ci/benchmark.sh
  after_script:
    - flux cancel "$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)" || true
  artifacts:
    paths: [cases.csv, overhead.csv]
    expire_in: 30 days

##############################################################################
# dlio-benchmark.yml -> DLIO integration. MANUAL for the same reason as
# benchmark: each matrix entry creates its own Flux allocation when
# triggered, keeping normal pipelines at one allocation total.
##############################################################################
dlio-benchmark:
  extends: .corona-flux
  stage: benchmark
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: true
  timeout: 9h
  parallel:
    matrix:
      - WORKLOAD: [bert_v100, cosmoflow_h100, dlrm, resnet50_tf, resnet50_h100, unet3d_h100]
  variables:
    ALLOC_NAME: "dftracer-dlio-$CI_JOB_ID"
    INSTALL_MODE: pip
    DLIO_LOG_LEVEL: info
    VALGRIND_DLIO_TIMEOUT: "3600"
    RDMAV_FORK_SAFE: "1"
  script:
    # Unique per-job name: `flux job last` is user-global and races with
    # other pipelines running under the same LC account.
    - flux alloc --bg -N 1 -q "$LARGE_QUEUE" -t "${LARGE_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - echo "Using Flux allocation $JOBID"
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/run-in-podman.sh docker.io/library/ubuntu:22.04 .gitlab/flux-ci/dlio-benchmark.sh
  after_script:
    - flux cancel "$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)" || true

##############################################################################
# Sphinx docs. Split out of `ci` so a docs-only change does not pay for a
# build, a test run or a wheel.
##############################################################################
docs:
  extends: .corona-flux
  stage: test
  needs: [allocate]
  <<: *push-mr-rules
  script:
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/run-in-podman.sh docker.io/library/python:3.11 .gitlab/flux-ci/docs.sh
  artifacts:
    paths: [public]

##############################################################################
# wheels.yml -> wheel builds. One allocation for the whole interpreter list;
# a parallel matrix would take one per interpreter.
##############################################################################
wheels:
  extends: .corona-flux
  stage: publish
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes: *code-paths
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    # No changes filter here: whatever develop publishes has to be a matched
    # set, or the docs would carry a version with no wheels behind it.
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
    - when: manual
      allow_failure: true
  variables:
    ALLOC_NAME: "dftracer-wheels-$CI_JOB_ID"
    PYTHON: "3.9,3.10,3.11,3.12,3.13,3.14"
    GLIBC: "2.28"
    # Only podman is on the nodes. DFTRACER_PODMAN_KEEP_STORAGE stays unset so
    # the image store lands on local disk, not the NFS home, which cannot hold
    # image-layer xattrs.
    CIBW_CONTAINER_ENGINE: podman
  timeout: 3h
  script:
    # Unique per-job name: `flux job last` is user-global and races with
    # other pipelines running under the same LC account.
    - flux alloc --bg -N 1 -q "$SMALL_QUEUE" -t "${SMALL_QUEUE_WALLTIME}m" --job-name="$ALLOC_NAME"
    - JOBID=$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)
    - test -n "$JOBID"
    # Not run-in-podman.sh: cibuildwheel drives podman, and that image has none.
    - flux proxy "$JOBID" flux run -N 1 bash .gitlab/flux-ci/wheels.sh
  after_script:
    - flux cancel "$(flux jobs -n --name="$ALLOC_NAME" -o "{id}" | head -1)" || true
  artifacts:
    paths: [wheelhouse/*.whl]
    expire_in: 30 days

##############################################################################
# docker-publish.yml -> DockerHub image (manual, v* tags). Keeps its docker
# image config (docker:dind runner required — the only migrated job that
# stays on a docker executor, since it is inherently a docker workload).
# Multi-arch (amd64+arm64) via buildx+qemu.
##############################################################################
docker-publish:
  stage: publish
  image: docker:latest
  services: [docker:dind]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
      allow_failure: true
  variables:
    IMAGE_NAME: dftracer/dftracer
  timeout: 4h
  script:
    - docker login -u "${DOCKER_USERNAME}" -p "${DOCKER_PASSWORD}" docker.io
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use
    - VERSION_TAG="${CI_COMMIT_TAG#v}"
    - docker buildx build
      --file infrastructure/docker/Dockerfile.prod
      --platform linux/amd64,linux/arm64
      --build-arg DFTRACER_VERSION=${VERSION_TAG}
      --tag ${IMAGE_NAME}:${VERSION_TAG}
      --tag ${IMAGE_NAME}:latest
      --push .

##############################################################################
# Publishes to the dldl workspace. No pages job: Pages is unreachable from LC.
##############################################################################
distribute:
  extends: .corona-flux
  stage: deploy
  # ci is optional only because a docs-only change does not run it; when it is
  # in the pipeline it must pass, or a failed build would publish.
  needs:
    - docs
    - wheels
    - job: ci
      optional: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"'
  script:
    - bash .gitlab/flux-ci/distribute.sh

##############################################################################
# Releases the pipeline-global Flux allocation (runs even on failure).
##############################################################################
release-allocation:
  extends: .corona-flux
  stage: cleanup
  # No `needs:` on purpose: a job that declares `needs` is SKIPPED when one of
  # them fails, which leaked the allocation on every failed pipeline. Plain
  # stage ordering + `when: always` guarantees cleanup after success, failure,
  # cancellation and manual reruns alike.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "push"'
      when: always
  script:
    - for id in $(flux jobs -n --name="$ALLOC_NAME" -o "{id}" 2>/dev/null); do echo "cancelling $id"; flux cancel "$id" || true; done
