[build-system]
requires = [
    "setuptools>=64", 
    "setuptools-scm>=8",
    "wheel",
    "ninja",
    "cmake>=3.24",
    "pybind11"
]
build-backend = "setuptools.build_meta"

[project]
name = "dftracer"
description = "I/O profiler for deep learning python apps. Specifically for dlio_benchmark."
readme = "README.md"
requires-python = '>=3.7'

authors = [
  { name = "Hariharan Devarajan (Hari)", email = "hariharandev1@llnl.gov" }
]
license = "MIT"
keywords = [
  "profiler", 
  "deep learning", 
  "I/O", 
  "benchmark", 
  "NPZ", 
  "pytorch benchmark", 
  "tensorflow benchmark",
]
classifiers = [
  # How mature is this project? Common values are
  #   3 - Alpha
  #   4 - Beta
  #   5 - Production/Stable
  "Development Status :: 3 - Alpha",
  # Indicate who your project is intended for
  "Intended Audience :: Science/Research",
  "Topic :: Software Development :: Build Tools",
  # Specify the Python versions you support here. In particular, ensure
  # that you indicate you support Python 3. These classifiers are *not*
  # checked by 'pip install'. See instead 'python_requires' below.
  "Programming Language :: Python :: 3.7",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3 :: Only",
]
# Extras are in setup.py, which pins dftracer-modules to this version.
dynamic = ["version", "optional-dependencies"]
dependencies = [
  "dftracer-utils>=0.0.14",
  "pydftracer>=2.0.6",
  # pydftracer 2.0.6 imports typing_extensions unconditionally but only declares
  # it for python_version < '3.10', so it has to be pulled in here.
  "typing_extensions>=4.0"
]

[project.scripts]
# Links libdftracer_core for this machine from the installed parts, building
# any module variant they lack from source (python/dftracer/compose.py).
dftracer-compose = "dftracer.compose:main"

[project.urls]
Homepage = "https://github.com/llnl-asr/dftracer"
Repository = "https://github.com/llnl-asr/dftracer"
"Bug Tracker" = "https://github.com/llnl-asr/dftracer/issues"
Documentation = "https://dftracer.readthedocs.io/en/latest/"

[tool]
files = "setup.py"
python_version = "3.7"
strict = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
warn_unreachable = true

[[tool.overrides]]
module = ["ninja"]
ignore_missing_imports = true


[tool.pytest.ini_options]
minversion = "6.0"
addopts = ["-ra", "--showlocals", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
testpaths = ["tests"]

[tool.cibuildwheel]
test-command = "pytest {project}/tests"
test-extras = ["test"]
test-skip = ["*universal2:arm64"]
# Setuptools bug causes collision between pypy and cpython artifacts
before-build = "rm -rf {project}/build"

[tool.ruff]
extend-select = [
  "B",    # flake8-bugbear
  "B904",
  "I",    # isort
  "PGH",  # pygrep-hooks
  "RUF",  # Ruff-specific
  "UP",   # pyupgrade
]
extend-ignore = [
  "E501",   # Line too long
]
target-version = "py38"

[tool.setuptools]
script-files = [
  "script/dftracer-preload-library-path",
  "script/dftracer_install_info",
  "script/git_sparse_clone_interactive",
  "script/git_sparse_push_interactive",
]

[tool.setuptools_scm]
local_scheme = "no-local-version"
write_to = "python/dftracer/_version.py"
