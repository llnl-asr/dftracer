name: CI deps image

# Builds the image every module variant is compiled in: every library version
# in dependency/variants.yaml on the manylinux_2_28 toolchain
# (infrastructure/ci/Containerfile.deps). It is tagged by a hash of what goes
# into it, so modules.yml finds the image for its own variants.yaml, and is
# rebuilt only when those inputs change. Layers are cached in the registry, so
# a run that fails part-way keeps the spack groups it finished.

#
# Run by hand. The image is normally built where there are cores and time for
# it and pushed from there (infrastructure/ci/podman.sh deps-image, then
# deps-push): from scratch it compiles every MPI and HDF5 build, hours on a
# GitHub runner, close to the job limit. Pushes to Docker Hub with the
# DOCKER_USERNAME / DOCKER_PASSWORD secrets, to the repository named by the
# DFTRACER_CI_DEPS_IMAGE variable (default docker.io/hdevarajan92/dftracer-ci).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deps-image
  cancel-in-progress: false

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate the build context from variants.yaml
        id: context
        run: |
          python -m pip install pyyaml
          v=tools/ci/variants.py
          ctx=$RUNNER_TEMP/deps-context
          mkdir -p "$ctx"
          python $v check
          python $v spack-env > "$ctx/spack.yaml"
          for g in mpi hdf5-serial hdf5-parallel other; do
            python $v spack-group $g > "$ctx/spack-$g.txt"
          done
          python $v coverage-specs > "$ctx/coverage-mpi.txt"
          python $v papi-versions > "$ctx/papi-versions.txt"
          python $v rocm-repos > "$ctx/rocm.repo"
          python $v gpu-packages > "$ctx/gpu-packages.txt"
          cp infrastructure/ci/Containerfile.deps tools/ci/spack_externals.py "$ctx/"
          echo "dir=$ctx" >> "$GITHUB_OUTPUT"
          echo "tag=$(tools/ci/deps-image-tag.sh)" >> "$GITHUB_OUTPUT"
          echo "repo=${{ vars.DFTRACER_CI_DEPS_IMAGE || 'docker.io/hdevarajan92/dftracer-ci' }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.context.outputs.dir }}
          file: ${{ steps.context.outputs.dir }}/Containerfile.deps
          push: true
          tags: |
            ${{ steps.context.outputs.repo }}:${{ steps.context.outputs.tag }}
            ${{ steps.context.outputs.repo }}:latest
          cache-from: type=registry,ref=${{ steps.context.outputs.repo }}:buildcache
          cache-to: type=registry,ref=${{ steps.context.outputs.repo }}:buildcache,mode=max
