name: MPI and HDF5 Trace CI

on:
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.readthedocs.yaml'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Each job loads one thing from the image: an MPI, or an HDF5. POSIX and STDIO
  # need neither and are tested by ci.yml.
  mpi:
    name: ${{ matrix.mpi }}
    runs-on: ubuntu-24.04
    container:
      # brahma's image: every MPI and HDF5 below, built for a generic x86-64
      # (llnl-asr/brahma infrastructure/docker/Dockerfile.ci).
      image: hdevarajan92/brahma-ci:mpi-wide
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        # One release of each family brahma has a compat interface for, a second
        # patch release in a family, and mpich 4.3.0, which has none and is traced
        # through the common interface alone.
        mpi: [mpich@3.4.3, mpich@4.2.3, mpich@4.3.0, openmpi@4.1.6, openmpi@4.1.8, openmpi@5.0.3, openmpi@5.0.6]
    env:
      DFTRACER_BUILD: ${{ github.workspace }}/dftracer-build
      DFTRACER_INSTALL: ${{ github.workspace }}/dftracer-install
      CMAKE_BUILD_PARALLEL_LEVEL: 4
      OMPI_ALLOW_RUN_AS_ROOT: 1
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: 1
    steps:
      - name: Checkout dftracer
        uses: actions/checkout@v4

      - name: Trust the root-owned CI workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git hwloc libboost-dev libhwloc-dev libyaml-cpp-dev \
            ninja-build pkg-config python3-dev python3-venv zlib1g-dev
          rm -rf /var/lib/apt/lists/*

      - name: Build dftracer with MPI
        shell: bash
        run: |
          source /home/spack/spack/share/spack/setup-env.sh
          spack load ${{ matrix.mpi }} cmake
          ./autobuild.sh --install-mode cmake --build-dir "${DFTRACER_BUILD}" --install-prefix "${DFTRACER_INSTALL}" \
            --with-c-compiler mpicc --with-cxx-compiler mpicxx --enable-mpi --enable-tests --jobs 4

      - name: Trace MPI and MPI-IO calls
        timeout-minutes: 5
        shell: bash
        run: |
          source /home/spack/spack/share/spack/setup-env.sh
          spack load ${{ matrix.mpi }}
          TRACES="${DFTRACER_BUILD}/trace-mpi"
          mkdir -p "${TRACES}/data"
          # OpenMPI's mpirun refuses root without --allow-run-as-root, and PRRTE
          # counts slots from the container's cpuset, smaller than two ranks.
          # MPICH's hydra mpirun takes neither flag.
          FLAGS=""
          case "${{ matrix.mpi }}" in openmpi*) FLAGS="--allow-run-as-root --map-by :OVERSUBSCRIBE";; esac
          # The preload goes to the ranks only: traced, mpirun's signal handling deadlocks.
          timeout 240 mpirun ${FLAGS} -np 2 env \
            LD_PRELOAD="$(find "${DFTRACER_BUILD}" -name libdftracer_preload_dbg.so | head -1)" \
            DFTRACER_ENABLE=1 DFTRACER_INIT=PRELOAD DFTRACER_INC_METADATA=1 DFTRACER_BIND_SIGNALS=0 \
            DFTRACER_LOG_FILE="${TRACES}/mpi" DFTRACER_DATA_DIR=/ \
            "${DFTRACER_BUILD}/bin/test_c_mpi" "${TRACES}/data"
          python3 .github/workflows/scripts/check_trace_calls.py "${TRACES}" 10 \
            MPI_Init_thread MPI_Barrier MPI_Bcast MPI_Allreduce \
            MPI_File_open MPI_File_write MPI_File_read MPI_File_close

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.mpi }}
          path: ${{ env.DFTRACER_BUILD }}/trace-mpi/*.pfw*
          retention-days: 7

  hdf5:
    name: ${{ matrix.hdf5 }}
    runs-on: ubuntu-24.04
    container:
      image: hdevarajan92/brahma-ci:mpi-wide
      options: --user root
    strategy:
      fail-fast: false
      matrix:
        # The image builds HDF5 with MPI, some versions more than once, so a spec
        # names the build by its MPI. Only HDF5 is traced: MPI is in the mpi job.
        hdf5: ["hdf5@1.8.23^mpich@3.4.3", "hdf5@1.10.11^openmpi@4.1.6", "hdf5@1.12.3^mpich@4.2.3", "hdf5@1.14.5^openmpi@5.0.6"]
    env:
      DFTRACER_BUILD: ${{ github.workspace }}/dftracer-build
      DFTRACER_INSTALL: ${{ github.workspace }}/dftracer-install
      CMAKE_BUILD_PARALLEL_LEVEL: 4
    steps:
      - name: Checkout dftracer
        uses: actions/checkout@v4

      - name: Trust the root-owned CI workspace
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Install system build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates git hwloc libboost-dev libhwloc-dev libyaml-cpp-dev \
            ninja-build pkg-config python3-dev python3-venv zlib1g-dev
          rm -rf /var/lib/apt/lists/*

      - name: Build dftracer with HDF5
        shell: bash
        run: |
          source /home/spack/spack/share/spack/setup-env.sh
          # spack load also puts the HDF5's MPI on PATH: a parallel HDF5's headers need mpi.h.
          spack load "${{ matrix.hdf5 }}" cmake
          ./autobuild.sh --install-mode cmake --build-dir "${DFTRACER_BUILD}" --install-prefix "${DFTRACER_INSTALL}" \
            --with-hdf5 "$(spack location -i "${{ matrix.hdf5 }}")" \
            --with-c-compiler mpicc --with-cxx-compiler mpicxx --enable-tests --jobs 4

      - name: Trace HDF5 calls
        timeout-minutes: 5
        shell: bash
        run: |
          source /home/spack/spack/share/spack/setup-env.sh
          spack load "${{ matrix.hdf5 }}"
          TRACES="${DFTRACER_BUILD}/trace-hdf5"
          mkdir -p "${TRACES}/data"
          LD_PRELOAD="$(find "${DFTRACER_BUILD}" -name libdftracer_preload_dbg.so | head -1)" \
            DFTRACER_ENABLE=1 DFTRACER_INIT=PRELOAD DFTRACER_INC_METADATA=1 \
            DFTRACER_LOG_FILE="${TRACES}/hdf5" DFTRACER_DATA_DIR=/ \
            timeout 120 "${DFTRACER_BUILD}/bin/test_c_hdf5" "${TRACES}/data"
          python3 .github/workflows/scripts/check_trace_calls.py "${TRACES}" 5 \
            H5Fcreate H5Dcreate2 H5Dwrite H5Dread H5Dclose H5Fclose

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: traces-${{ matrix.hdf5 }}
          path: ${{ env.DFTRACER_BUILD }}/trace-hdf5/*.pfw*
          retention-days: 7
