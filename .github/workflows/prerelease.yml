name: Publish prerelease

# Every merge into develop publishes the wheels from wheels.yml -- the same build
# and validation the pull request ran -- plus an sdist, versioned
# <last tag>.post<commits since tag>.dev0, a prerelease that only pip --pre
# installs:
#
#   2.1.1             the tag
#   2.1.1.post5.dev0  develop, 5 commits later
#
# A commit that is exactly a tag is skipped; that is a release and belongs to
# python-publish.yml.

on:
  push:
    branches: [develop]
    paths:
      - 'CMakeLists.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'VERSION'
      - 'PACKAGE_VERSION'
      - 'cmake/**'
      - 'src/**'
      - 'include/**'
      - 'python/**'
      - 'dependency/**'
      - 'scripts/wheel/**'
  workflow_dispatch:

permissions:
  contents: read

# Serialise rather than cancel: each develop commit gets its own postN, and
# cancelling mid-upload could leave a release half published.
concurrency:
  group: prerelease-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the commit is not a release
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        env:
          DFTRACER_VERSION_SCHEME: postdev
        run: |
          version="$(scripts/wheel/build_wheels.sh --list | awk '/wheel version/ {print $NF}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *.post*)
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "publishing $version"
              ;;
            *)
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "$version is a tagged release, leaving it to python-publish.yml"
              ;;
          esac

  wheels:
    name: Wheels
    needs: check
    if: needs.check.outputs.publish == 'true'
    uses: ./.github/workflows/wheels.yml
    with:
      python_versions: '3.9,3.10,3.11,3.12,3.13,3.14'
      glibc: '2.28'
      version_scheme: 'postdev'

  sdist:
    name: Source distribution
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The sdist is what lets an MPI or HDF5 build run off a prerelease:
      #   DFTRACER_ENABLE_MPI=ON pip install --pre --no-binary dftracer dftracer
      - name: Build sdist
        # setuptools-scm would derive <tag>.dev<distance> from setup.py's scheme;
        # pin the version the wheels were built with so the two agree.
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ needs.check.outputs.version }}
        run: |
          python -m pip install --upgrade pip build twine
          python -m build --sdist --outdir dist .
          python -m twine check dist/*
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [check, wheels, sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: 'wheel-*'
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: List distributions
        run: ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          # A re-run of the same commit would otherwise fail on an existing file.
          skip-existing: true
